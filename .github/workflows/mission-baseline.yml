name: Mission Baseline

on:
  push:
    branches:
      - "**"
  pull_request:

jobs:
  validate-missions:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install mission validation dependencies
        run: npm run setup:missions

      - name: Validate browser missions
        run: npm test
